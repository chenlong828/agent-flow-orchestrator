          type: array
          items:
            "$ref": "#/components/schemas/ReferenceItem"
          description: 引用方列表
      description: 删除前的引用检查页；total 与 items 由引用关系实时生成。
    WorkflowSort:
      type: string
      enum:
      - name:asc
      - name:desc
      - updatedAt:asc
      - updatedAt:desc
      default: updatedAt:desc
      description: 工作流排序字段与方向；默认 updatedAt:desc。
    WorkflowNodeType:
      type: string
      enum:
      - start
      - end
      - agent
      - review
      - confirm
      - fanout
      - fanin
      description: 工作流节点类型；start/end/agent/review/fanout/fanin 必须绑定专家，confirm 禁止绑定。
    WorkflowEdgeKind:
      type: string
      enum:
      - seq
      - rollback
      description: 边类型；seq 构成单主链，rollback 指回祖先节点。
    WorkflowStage:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: 工作流内稳定阶段 ID，不是 UUID。
        name:
          type: string
          description: 阶段显示名称。
        description:
          type: string
          maxLength: 500
          description: 阶段描述。
        layout:
          type: object
          additionalProperties: true
          description: 前端画布布局；后端只透传，不解释字段。
      description: 工作流阶段；只用于展示与节点归组。
    WorkflowNode:
      type: object
      required:
      - id
      - type
      - name
      - stageId
      - expertId
      properties:
        id:
          type: string
          description: 工作流内稳定节点 ID，不是 UUID。
        type:
          "$ref": "#/components/schemas/WorkflowNodeType"
          description: 节点类型。
        name:
          type: string
          description: 节点显示名称。
        stageId:
          type: string
          nullable: true
          description: 所属阶段 ID；可为 null。
        expertId:
          type: string
          format: uuid
          nullable: true
          description: 绑定专家 ID；按节点矩阵必填或禁止。
        layout:
          type: object
          additionalProperties: true
          description: 前端画布布局；后端只透传，不解释字段。
      description: 工作流节点；专家绑定用于执行和引用投影。
    WorkflowEdge:
      type: object
      required:
      - id
      - from
      - to
      - kind
      properties:
        id:
          type: string
          description: 工作流内稳定边 ID，不是 UUID。
        from:
          type: string
          description: 起点节点 ID。
        to:
          type: string
          description: 终点节点 ID。
        kind:
          "$ref": "#/components/schemas/WorkflowEdgeKind"
          description: 边类型。
      description: 工作流有向边；from/to 必须指向同一工作流内的节点。
    WorkflowGraph:
      type: object
      required:
      - stages
      - nodes
      - edges
      properties:
        stages:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowStage"
          description: 阶段列表。
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowNode"
          description: 节点列表。
        edges:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowEdge"
          description: 边列表。
        viewport:
          type: object
          additionalProperties: true
          description: 前端画布视口；后端只透传，不解释字段。
      description: 工作流当前图；含 stages/nodes/edges 与可选展示对象，禁止 behavior 与未知字段。
    WorkflowSummary:
      type: object
      required:
      - id
      - name
      - type
      - description
      - nodeCount
      - stageCount
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      properties:
        id:
          type: string
          format: uuid
          description: 工作流 ID（UUIDv7）。
        name:
          type: string
          description: 工作流名称，1–80 字，大小写不敏感唯一。
        type:
          type: string
          description: 类型标签，1–40 字，可编辑。
        description:
          type: string
          description: 描述，0–500 字。
        nodeCount:
          type: integer
          minimum: 0
          description: 当前图节点数。
        stageCount:
          type: integer
          minimum: 0
          description: 当前图阶段数。
        revision:
          type: integer
          minimum: 1
          description: 乐观锁版本，从 1 开始。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
        updatedBy:
          type: string
          nullable: true
          description: 最后更新操作者；仅用于展示与审计，不参与授权。
      description: 工作流列表项；不包含完整图。
    WorkflowDetail:
      allOf:
      - "$ref": "#/components/schemas/WorkflowSummary"
      - type: object
        required:
        - graph
        properties:
          graph:
            "$ref": "#/components/schemas/WorkflowGraph"
            description: 唯一当前图。
      description: 工作流详情；包含完整 graph（含可选展示视口）。
    WorkflowCreate:
      type: object
      required:
      - name
      - type
      - graph
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 工作流名称。
        type:
          type: string
          minLength: 1
          maxLength: 40
          description: 类型标签。
        description:
          type: string
          maxLength: 500
          description: 描述，缺省为空串。
        graph:
          "$ref": "#/components/schemas/WorkflowGraph"
          description: 创建时的完整合法图；必须包含 start/end 与合法拓扑。
      description: 创建工作流请求；创建即写图，不再先落空图。
    WorkflowUpdate:
      type: object
      required:
      - name
      - type
      - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 工作流名称。
        type:
          type: string
          minLength: 1
          maxLength: 40
          description: 类型标签。
        description:
          type: string
          maxLength: 500
          description: 描述，可为空串。
      description: 整体更新工作流元数据请求。
    WorkflowCopy:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 新名称；省略时使用源名称 + “ 副本”并自动加后缀。
      description: 复制工作流请求。
    WorkflowSaveDefinition:
      type: object
      required:
      - graph
      properties:
        graph:
          "$ref": "#/components/schemas/WorkflowGraph"
          description: 要保存或校验的完整图。
      description: 保存或校验工作流图的请求。
    ValidationIssue:
      type: object
      required:
      - code
      - path
      - message
      properties:
        code:
          type: string
          description: 稳定问题码，例如 missing_start、expert_missing。
        path:
          type: string
          description: 字段路径，统一使用数组下标，例如 graph.nodes[1].expertId。
        message:
          type: string
          description: 中文说明。
      description: 单个校验问题。
    ValidationReport:
      type: object
      required:
      - errors
      - warnings
      properties:
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationIssue"
          description: 形状、拓扑与专家绑定错误。
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationIssue"
          description: 非阻断警告；当前只有专家停用。
      description: 校验报告；不写数据库。
    WorkflowDslMetadata:
      type: object
      required:
      - name
      - type
      - description
      properties:
        name:
          type: string
          description: 工作流名称。
        type:
          type: string
          description: 类型标签。
        description:
          type: string
          description: 描述。
      description: DSL 元数据。
    WorkflowDsl:
      type: object
      required:
      - dslVersion
      - metadata
      - stages
      - nodes
      - edges
      properties:
        dslVersion:
          type: integer
          enum:
          - 1
          description: DSL 版本，当前只支持 1。
        metadata:
          "$ref": "#/components/schemas/WorkflowDslMetadata"
          description: 工作流元数据。
        stages:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowStage"
          description: 阶段列表。
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowNode"
          description: 节点列表。
        edges:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowEdge"
          description: 边列表。
        layout:
          type: object
          additionalProperties: false
          properties:
            viewport:
              type: object
              additionalProperties: true
              description: 前端画布视口；后端只透传，详细结构由 dsl.schema.json 定义。
          description: 可选的 DSL 布局包装；只承载视口。
      description: 导入/导出的 JSON DSL 文档；YAML 导出是同一结构的无损渲染。
    WorkflowList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/WorkflowSummary"
          description: 当前页工作流。
        total:
          type: integer
          minimum: 0
          description: 总数。
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: 每页数量。
        offset:
          type: integer
          minimum: 0
          description: 偏移量。
      description: 工作流分页列表。
    WorkflowMutationResult:
      type: object
      required:
      - id
      - revision
      - warnings
      properties:
        id:
          type: string
          format: uuid
          description: 工作流 ID（UUIDv7）。
        revision:
          type: integer
          minimum: 1
          description: 新工作流的当前版本。
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationIssue"
          description: 非阻断警告，例如专家已停用。
      description: 创建或复制成功响应；详情通过 GET /workflows/{id} 获取。
    WorkflowSaveResult:
      type: object
      required:
      - workflow
      - warnings
      properties:
        workflow:
          "$ref": "#/components/schemas/WorkflowDetail"
          description: 保存后的工作流详情。
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationIssue"
          description: 非阻断警告；当前只有专家停用。结构/拓扑/绑定错误返回 400。
      description: 保存定义响应。
    WorkflowImportResult:
      type: object
      required:
      - workflow
      - idMap
      - warnings
      properties:
        workflow:
          "$ref": "#/components/schemas/WorkflowDetail"
          description: 新建的工作流详情。
        idMap:
          type: object
          additionalProperties:
            type: string
          description: 导入 ID 映射；v1 为恒等映射。
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationIssue"
          description: 缺失/停用专家等警告。
      description: 导入 DSL 响应。
  responses:
    BadRequest:
      description: 请求形状/字段/枚举/范围错误，或请求体引用的目标不存在。多字段图校验的 `error.details.issues` 为 `{code,path,message}`，并保留 `fieldErrors` 兼容；路径使用数组下标。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: 路径资源不存在；草稿已清理也返回 404。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: 名称重复、revision/baseRevision 冲突、附件改名目标已存在，或删除时仍被引用；`error.code` 区分。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Gone:
      description: 草稿记录仍在但已过期；`error.code=draft_expired`，`details.expiresAt` 为过期时间。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: 单文件、文件数、包总量或草稿总量超限；`error.code=payload_too_large`，`details.limit` 区分口径。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: 草稿附件上传不是 `multipart/form-data`；`error.code=unsupported_media_type`。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: 生成的 `SKILL.md` 超过 16384 字节；`error.code=skill_md_too_large`，带 `limitBytes` 与 `actualBytes`。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: 缺少 `If-Match` 请求头。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: 未分类服务端错误，或已保存包缺失/损坏（`package_unavailable`）；不返回堆栈或 SQL。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: 数据库不可用。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
