components:
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: false
      description: 显示用操作者标识，不是身份认证。
      schema:
        type: string
        maxLength: 200
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 可选的请求追踪 ID；服务端可在响应中回显。
      schema:
        type: string
        maxLength: 200
    Id:
      name: id
      in: path
      required: true
      description: 资源 ID（UUIDv7）；格式不合法返回 400，格式合法但资源不存在返回 404。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 revision，带双引号，例如 `"3"`。缺失返回 428，旧版本返回 409。
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"3"'
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: 已有草稿保存必须带 baseRevision（带双引号）；新建草稿必须不带。缺失时已有草稿 428，新建带了 400。
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"3"'
    Q:
      name: q
      in: query
      required: false
      description: 名称大小写不敏感包含匹配。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量，1–200；越界或非整数返回 400，不截断。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: 偏移量。
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ErrorCode:
      type: string
      enum:
      - validation_error
      - not_found
      - name_conflict
      - revision_conflict
      - referenced
      - file_conflict
      - draft_expired
      - payload_too_large
      - unsupported_media_type
      - skill_md_too_large
      - precondition_required
      - package_unavailable
      - internal
      - service_unavailable
      description: 稳定错误码；客户端按 code 分支，不依赖中文 message。
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          "$ref": "#/components/schemas/ErrorCode"
          description: 稳定错误码
        message:
          type: string
          description: 中文错误说明
        details:
          type: object
          additionalProperties: true
          description: 错误附加信息
        requestId:
          type: string
          description: 请求追踪 ID，可能为空
      description: 统一错误体内容；details 的结构由 code 决定。
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorDetail"
          description: 错误内容
      description: 所有业务错误使用同一外层结构。
    Health:
      type: object
      required:
      - status
      - database
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          description: 健康状态
        database:
          type: string
          enum:
          - up
          - down
          description: 数据库状态
      description: 进程与数据库健康状态；status=degraded 时 HTTP 为 503。
    EnabledPatch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: 是否启用
      description: 启停请求体。
    HarnessKind:
      type: string
      enum:
      - container
      - server
      - desktop
      - laptop
      description: Harness 类型。
    HarnessAccessMode:
      type: string
      enum:
      - agent
      - ssh
      - container_registry
      description: Harness 接入方式。
    HarnessHealth:
      type: string
      enum:
      - unknown
      - online
      - offline
      - overloaded
      description: Harness 运行时健康状态；由运行时维护，不由创建/更新请求写入。
    HarnessQueuePolicy:
      type: string
      enum:
      - fifo
      - priority
      description: Harness 排队策略。
    HarnessSort:
      type: string
      enum:
      - name:asc
      - name:desc
      - updatedAt:asc
      - updatedAt:desc
      default: updatedAt:desc
      description: Harness 列表排序字段与方向。
    HarnessListItem:
      type: object
      required:
      - id
      - name
      - kind
      - address
      - accessMode
      - enabled
      - health
      - lastHeartbeatAt
      - concurrencyMax
      - queuePolicy
      - tags
      - toolCount
      - revision
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 名称，大小写不敏感唯一
        kind:
          "$ref": "#/components/schemas/HarnessKind"
          description: Harness 类型
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: 接入地址
        accessMode:
          "$ref": "#/components/schemas/HarnessAccessMode"
          description: 接入方式
        enabled:
          type: boolean
          description: 是否启用
        health:
          "$ref": "#/components/schemas/HarnessHealth"
          description: 运行时健康状态，只读
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
          description: 最近心跳时间，只读；可为 null
        concurrencyMax:
          type: integer
          minimum: 1
          description: 最大并发数，≥1
        queuePolicy:
          "$ref": "#/components/schemas/HarnessQueuePolicy"
          description: 排队策略
        tags:
          type: array
          items:
            type: string
          description: 能力标签，有序
        toolCount:
          type: integer
          minimum: 0
          description: 引用工具数，实时派生
        revision:
          type: integer
          minimum: 1
          description: 乐观锁版本，从 1 开始
        updatedAt:
          type: string
          format: date-time
          description: 更新时间，ISO-8601 UTC
      description: Harness 列表项；计数与运行时字段由服务端派生。
    HarnessDetail:
      allOf:
      - "$ref": "#/components/schemas/HarnessListItem"
      - type: object
        required:
        - description
        - createdAt
        properties:
          description:
            type: string
            maxLength: 500
            description: 描述
          createdAt:
            type: string
            format: date-time
            description: 创建时间，ISO-8601 UTC
      description: Harness 详情；列表项字段加描述与创建时间。
    HarnessCreate:
      type: object
      required:
      - name
      - kind
      - address
      - accessMode
      - concurrencyMax
      - queuePolicy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 名称，1–80 字，大小写不敏感唯一
        kind:
          "$ref": "#/components/schemas/HarnessKind"
          description: Harness 类型
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: 接入地址，1–200 字
        accessMode:
          "$ref": "#/components/schemas/HarnessAccessMode"
          description: 接入方式
        description:
          type: string
          maxLength: 500
          description: 描述，≤500 字
        concurrencyMax:
          type: integer
          minimum: 1
          description: 最大并发数，≥1
        queuePolicy:
          "$ref": "#/components/schemas/HarnessQueuePolicy"
          description: 排队策略
        tags:
          type: array
          items:
            type: string
          description: 能力标签，有序
        enabled:
          type: boolean
          default: true
          description: 是否启用；省略时默认 true
      description: 创建 Harness 请求；enabled 可省略，默认 true。
    HarnessUpdate:
      type: object
      required:
      - name
      - kind
      - address
      - accessMode
      - concurrencyMax
      - queuePolicy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 名称，1–80 字，大小写不敏感唯一
        kind:
          "$ref": "#/components/schemas/HarnessKind"
          description: Harness 类型
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: 接入地址，1–200 字
        accessMode:
          "$ref": "#/components/schemas/HarnessAccessMode"
          description: 接入方式
        description:
          type: string
          maxLength: 500
          description: 描述，≤500 字
        concurrencyMax:
          type: integer
          minimum: 1
          description: 最大并发数，≥1
        queuePolicy:
          "$ref": "#/components/schemas/HarnessQueuePolicy"
          description: 排队策略
        tags:
          type: array
          items:
            type: string
          description: 能力标签，有序
      description: 全量更新 Harness 请求；不接收 enabled，启停走独立端点。
    HarnessList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/HarnessListItem"
          description: 当前页 Harness
        total:
          type: integer
          minimum: 0
          description: 匹配总数
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: 每页数量
        offset:
          type: integer
          minimum: 0
          description: 偏移量
      description: Harness 分页列表。
    ToolKind:
      type: string
      enum:
      - mcp
      - cli
      - script
      description: 工具类型。
    ToolStatus:
      type: string
      enum:
      - unverified
      - available
      - unavailable
      description: 工具运行时状态；创建时固定 unverified，B1 不提供调试/标记可用端点。
    ToolSort:
      type: string
      enum:
      - name:asc
      - name:desc
      - updatedAt:asc
      - updatedAt:desc
      default: updatedAt:desc
      description: 工具列表排序字段与方向。
    ToolParam:
      type: object
      required:
      - key
      - type
      properties:
        key:
          type: string
          minLength: 1
          description: 参数名，工具内唯一
        type:
          type: string
          enum:
          - string
          - int
          description: 参数类型
        description:
          type: string
          description: 参数说明；可省略，省略时返回空字符串
      description: 工具参数；HTTP 字段 key 对应领域字段 paramKey。
    ToolListItem:
      type: object
      required:
      - id
      - name
      - kind
      - invocation
      - description
      - harnessId
      - harnessName
      - timeoutMs
      - status
      - lastDebugAt
      - paramCount
      - usedByCount
      - revision
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 名称，大小写不敏感唯一
        kind:
          "$ref": "#/components/schemas/ToolKind"
          description: 工具类型
        invocation:
          type: string
          minLength: 1
          maxLength: 500
          description: 命令模板或端点
        description:
          type: string
          maxLength: 500
          description: 描述；列表检索与导航使用，空描述返回空字符串
        harnessId:
          type: string
          format: uuid
          description: 所属 Harness ID
        harnessName:
          type: string
          description: 所属 Harness 名称，派生
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 600000
          description: 超时时间，1000–600000 毫秒
        status:
          "$ref": "#/components/schemas/ToolStatus"
          description: 运行时状态，只读
        lastDebugAt:
          type: string
          format: date-time
          nullable: true
          description: 最近调试时间，只读；可为 null
