---
openapi: 3.0.3
info:
  title: AgentFlow B1 资产注册中心 API
  version: 0.1.0
  description: |
    AgentFlow B1 控制面的 HTTP JSON 契约，覆盖 Harness、工具、Skill、专家、
    引用页与健康检查。业务端点统一以 `/api/v1` 为前缀，`/healthz` 不参与版本。

    本文件是 `CMP-http-gateway` 的运行时 OpenAPI 资产，由 `spec.md` 派生，供外部 HTTP 客户端与接口调试工具对照使用。
    本仓库只提供 HTTP API，不提供产品 UI、CLI 或库；Swagger UI 是开发者文档，不是产品 UI。
    `spec.md` 是契约权威版本；若两者冲突，以 `spec.md` 为准。

    通用约定：
    - 请求/响应为 `application/json; charset=utf-8`；ID 为 UUIDv7；时间为 ISO-8601 UTC。
    - 列表响应为 `{items,total,limit,offset}`；`limit` 默认 50、上限 200。
    - 更新、启停、删除、专家装配需带 `If-Match: "<revision>"`；缺少为 428，旧版本为 409。
    - 无登录/鉴权；`X-Actor` 仅用于显示，不是身份。请求可带 `X-Request-Id`，响应可回显。无 CORS 配置。
  x-source-spec: docs/design/components/http-gateway/spec.md
  x-contract-status: current
  x-api-count: 29
  license:
    name: Internal use only
  x-runtime-asset: true
security: []
servers:
- url: "/"
  description: 当前文档所在服务；业务路径已包含 /api/v1，/healthz 不在版本内。
tags:
- name: Harness
  description: Harness 资产的生命周期、检索与引用。
- name: Tool
  description: 工具资产、参数、Harness 归属与引用。
- name: Skill
  description: Skill 资产、五章、分类、启停与引用。
- name: Expert
  description: 专家资产、五区、有序装配与引用。
- name: Reference
  description: 删除前的引用检查页。
- name: Health
  description: 进程与数据库健康检查。
paths:
  "/healthz":
    get:
      tags:
      - Health
      summary: API-H 健康检查
      operationId: getHealth
      x-api-id: API-H
      x-component-method: platform.Health.check
      description: 返回进程与数据库健康状态；数据库不可用时返回 503。
      responses:
        '200':
          description: 进程与数据库均正常。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '503':
          description: 数据库不可用。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/api/v1/harnesses":
    parameters:
    - "$ref": "#/components/parameters/Actor"
    - "$ref": "#/components/parameters/RequestId"
    get:
      tags:
      - Harness
      summary: API-01 查询 Harness 列表
      operationId: listHarnesses
      x-api-id: API-01
      x-component-method: catalog.listHarnesses
      description: 按名称、类型、启停状态、健康状态筛选；支持分页与排序。
      parameters:
      - "$ref": "#/components/parameters/Q"
      - name: kind
        in: query
        required: false
        description: Harness 类型。
        schema:
          "$ref": "#/components/schemas/HarnessKind"
      - name: enabled
        in: query
        required: false
        description: 启停状态。
        schema:
          type: boolean
      - name: health
        in: query
        required: false
        description: 运行时健康状态。
        schema:
          "$ref": "#/components/schemas/HarnessHealth"
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Offset"
      - name: sort
        in: query
        required: false
        description: 排序字段与方向。
        schema:
          "$ref": "#/components/schemas/HarnessSort"
      responses:
        '200':
          description: Harness 分页列表。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HarnessList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      tags:
      - Harness
      summary: API-03 创建 Harness
      operationId: createHarness
      x-api-id: API-03
      x-component-method: harness.create + catalog.getHarness
      description: 创建成功后返回资源详情；可传 `enabled`，默认 `true`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HarnessCreate"
      responses:
        '201':
          description: 创建成功。
          headers:
            Location:
              description: 新资源详情路径。
              schema:
                type: string
                example: "/api/v1/harnesses/0191f2f0-7a5e-7c3b-9d1a-3f2b4c5d6e7f"
