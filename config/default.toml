# 默认启动配置。优先级：本文件 < config/local.toml < process.env。
# 数据库连接串属于密钥，只从 DATABASE_URL / .env 读取，不写在 TOML。

[server]
host = "127.0.0.1"
port = 3000

[app]
actor = "local"

[log]
level = "info"

[executor]
max_attempts = 3
retry_delay_ms = 5000

[run]
default_timeout_ms = 1800000
max_node_visits = 5
max_input_files = 8
max_input_file_bytes = 8388608
max_input_bytes = 20971520

[archive]
root = ".local/archive"
