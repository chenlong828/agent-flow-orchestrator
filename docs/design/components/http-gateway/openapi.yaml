components:
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: false
      description: 显示用操作者标识，不是身份认证。
      schema:
        type: string
        maxLength: 200
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 可选的请求追踪 ID；服务端可在响应中回显。
      schema:
        type: string
        maxLength: 200
    Id:
      name: id
      in: path
      required: true
      description: 资源 ID（UUIDv7）。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 revision，带双引号，例如 `"3"`。缺失返回 428，旧版本返回 409。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'
    Q:
      name: q
      in: query
      required: false
      description: 名称大小写不敏感包含匹配。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: 偏移量。
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    ErrorCode:
      type: string
      enum:
        - validation_error
        - not_found
        - name_conflict
        - revision_conflict
        - referenced
        - precondition_required
        - internal
        - service_unavailable

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 中文错误说明。
        details:
          type: object
          additionalProperties: true
          description: 按错误类型定义；校验错误至少含 `field`/`reason`。
        requestId:
          type: string
          description: 请求追踪 ID；可能为空。

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]

    EnabledPatch:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    HarnessKind:
      type: string
      enum: [container, server, desktop, laptop]

    HarnessAccessMode:
      type: string
      enum: [agent, ssh, container_registry]

    HarnessHealth:
      type: string
      enum: [unknown, online, offline, overloaded]

    HarnessQueuePolicy:
      type: string
      enum: [fifo, priority]

    HarnessSort:
      type: string
      enum:
        - name:asc
        - name:desc
        - updatedAt:asc
        - updatedAt:desc
      default: updatedAt:desc

    HarnessListItem:
      type: object
      required:
        - id
        - name
        - kind
        - address
        - accessMode
        - enabled
        - health
        - lastHeartbeatAt
        - concurrencyMax
        - queuePolicy
        - tags
        - toolCount
        - revision
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/HarnessKind'
        address:
          type: string
          minLength: 1
          maxLength: 200
        accessMode:
          $ref: '#/components/schemas/HarnessAccessMode'
        enabled:
          type: boolean
        health:
          $ref: '#/components/schemas/HarnessHealth'
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
        concurrencyMax:
          type: integer
          minimum: 1
        queuePolicy:
          $ref: '#/components/schemas/HarnessQueuePolicy'
        tags:
          type: array
          items:
            type: string
        toolCount:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time

    HarnessDetail:
      allOf:
        - $ref: '#/components/schemas/HarnessListItem'
        - type: object
          required: [description, createdAt]
          properties:
            description:
              type: string
              maxLength: 500
            createdAt:
              type: string
              format: date-time

    HarnessCreate:
      type: object
      required:
        - name
        - kind
        - address
        - accessMode
        - concurrencyMax
        - queuePolicy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/HarnessKind'
        address:
          type: string
          minLength: 1
          maxLength: 200
        accessMode:
          $ref: '#/components/schemas/HarnessAccessMode'
        description:
