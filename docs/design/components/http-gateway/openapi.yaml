            $ref: '#/components/schemas/HarnessKind'
        - name: enabled
          in: query
          required: false
          description: 启停状态。
          schema:
            type: boolean
        - name: health
          in: query
          required: false
          description: 运行时健康状态。
          schema:
            $ref: '#/components/schemas/HarnessHealth'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: sort
          in: query
          required: false
          description: 排序字段与方向。
          schema:
            $ref: '#/components/schemas/HarnessSort'
      responses:
        '200':
          description: Harness 分页列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Harness]
      summary: API-03 创建 Harness
