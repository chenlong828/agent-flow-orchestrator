            - skills
            - tools
            - refs
            - createdAt
          properties:
            duty:
              type: string
            skillOrder:
              type: string
            verifyOrder:
              type: string
            notes:
              type: string
            skills:
              type: array
              items:
                $ref: '#/components/schemas/ExpertSkillSummary'
            tools:
              type: array
              items:
                $ref: '#/components/schemas/ExpertToolSummary'
            refs:
              type: array
              items:
                $ref: '#/components/schemas/ExpertRef'
            createdAt:
              type: string
              format: date-time

    ExpertCreate:
      type: object
      required: [name, color, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        role:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
          default: true
        persona:
          type: array
          items:
            type: string
        duty:
          type: string
        skillOrder:
          type: string
        verifyOrder:
          type: string
        notes:
          type: string
        refs:
          type: array
          items:
            $ref: '#/components/schemas/ExpertRef'

    ExpertUpdate:
      type: object
      required: [name, color, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        role:
          type: string
          minLength: 1
          maxLength: 200
        persona:
          type: array
          items:
            type: string
        duty:
          type: string
        skillOrder:
          type: string
        verifyOrder:
          type: string
        notes:
          type: string
        refs:
          type: array
          items:
            $ref: '#/components/schemas/ExpertRef'

    ExpertSkillAssembly:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [skillId]
            properties:
              skillId:
                type: string
                format: uuid

    ExpertToolAssembly:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [toolId]
            properties:
              toolId:
                type: string
                format: uuid

    ExpertList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpertListItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0

    ReferenceAsset:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [harness, tool, skill]
        id:
          type: string
          format: uuid
        name:
          type: string

    ReferenceItem:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [tool, expert]
        id:
          type: string
          format: uuid
        name:
          type: string

    ReferencePage:
      type: object
      required: [asset, total, items]
      properties:
        asset:
          $ref: '#/components/schemas/ReferenceAsset'
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'

  responses:
    BadRequest:
      description: 请求形状/字段/枚举/范围错误，或请求体引用的目标不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 路径资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 名称重复、revision 冲突，或删除时仍被引用；`error.code` 区分。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: 缺少 `If-Match` 请求头。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未分类服务端错误；不返回堆栈或 SQL。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 数据库不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
